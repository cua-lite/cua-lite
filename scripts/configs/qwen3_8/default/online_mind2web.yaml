# Qwen3.8 rollout eval on Online-Mind2Web.
# Screenshot-first observations; env disables model-visible URL/title/body page
# context while keeping dataset pinning, v2 trajectories, and WebJudge reward/eval.
#
# Related configs (sync env_kwargs when changing):
#   - scripts/configs/gpt/default/online_mind2web.yaml
#   - scripts/configs/qwen3_vl/default/online_mind2web.yaml

agent_id: "qwen3_8"
agent_kwargs:
  sampling_kwargs:  # only honored by rollout.py; RL sets sampling via the trainer (--rollout-temperature/--eval-temperature)
    temperature: 0.0

env_id: "online_mind2web"
env_kwargs:
  include_page_context_text: false
  # Online-Mind2Web is NOT a pure-QA benchmark: its 300 tasks carry no
  # reference answer (data/tasks.json fields: confirmed_task / level /
  # reference_length / website) and most are imperatives ("Add a Box Combo to
  # my bag"). The reward is WebJudge over the screenshot trajectory + the
  # action strings (``_webjudge_online_mind2web_eval``), which never reads the
  # agent's answer — so an action task has nothing to ``response`` with and
  # needs ``terminate`` to signal done / infeasible instead of burning to
  # max_steps. ``response`` stays for the QA-shaped tasks (it appends
  # "TASK_COMPLETE -> ANSWER: …" to the judged action history).
  extra_tools: ["goto", "back", "forward", "response", "terminate"]
