# Claude mobile on MobileWorld
# 161 registered tasks; the eval runner filters 44 ask_user tasks, leaving
# 117 GUI-only tasks evaluated by real device / backend state.
#
# Related configs (sync env_kwargs when changing):
#   - scripts/configs/gpt/default/mobileworld.yaml  (GPT mobile rollout)
#   - scripts/configs/qwen3_vl/default/mobileworld.yaml  (Qwen3-VL baseline)
#   - scripts/configs/claude/default/androidworld.yaml  (Claude mobile sibling)
#
# Interaction tasks carry exclude_reason="ask_user". Direct rollout calls
# should pass --filter "lambda m: not m.others.get('exclude_reason')".

agent_id: "claude"
agent_kwargs:
  api_kwargs:
    effort: "medium"
    max_tokens: 4096

# max_steps omitted: mobileworld's env default is 50 (upstream ``mw eval
# --max_round 50``).
env_id: "mobileworld"
env_kwargs:
  # open_app (make_open_app_tool → app-name enum) + ask_user are both env
  # extra_tools now; Claude no longer defines open_app natively (surfaced like qwen).
  loop_detect: 0
  extra_tools: ["open_app", "ask_user", "response", "terminate"]
