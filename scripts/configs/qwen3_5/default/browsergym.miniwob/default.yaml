# Qwen3.5 vision+coord rollout eval on cua-lite browsergym.miniwob (full 125 tasks).
#
# Sampling: greedy decode (temperature 0.0), no native thinking channel — the
# eval-matrix default (the qwen3_vl adapter defaults enable_thinking=False and every
# Qwen3.5 adapter inherits it; see lite/agents/models/qwen3_vl/adapter.py).
#
# Protocol: `Qwen3_5HistoryProtocol` rolling-window + image-fold (history_n=100,
# image_max=4, fold_size=4), byte-faithful to
# `${CUA_LITE_REFERENCES_ROOT}/OSWorld/scripts/python/run_multienv_qwen35vl.py`.
# LiteBrowserActionSpace coord actions ([0, 1000] normalized → pixel via env viewport).
#
# Prereqs: miniwob HTML server on 7560; MINIWOB_URL=http://localhost:7560/miniwob/.

agent_id: "qwen3_5"
agent_kwargs:
  sampling_kwargs:  # only honored by rollout.py; RL sets sampling via the trainer (--rollout-temperature/--eval-temperature)
    temperature: 0.0

env_id: "browsergym.miniwob"
env_kwargs:
  max_steps: 10
  extra_tools: ["response", "terminate", "goto", "back", "forward"]
  # ─── Obs mode: screenshot only (vision+coord) ────────────────────────
  # Defaults from ``BrowserGymConfig`` (``use_screenshot=true``,
  # ``use_ax_tree=false``); the agent sees the page as a raw screenshot
  # and emits coord-based actions via ``LiteBrowserActionSpace``. Listed
  # explicitly here for symmetry with text_only.yaml's obs-mode block.
  use_screenshot: true
  use_ax_tree: false
  include_page_context_text: false

  # Vision fast-path: explicitly skip BrowserGym's O(nodes) per-step DOM-
  # snapshot + AXTree + extra-properties extraction (only the screenshot is
  # used). SAFE here: coordinate-only action space (no bids). Independent of
  # use_ax_tree by design (keeps set-of-marks vision possible). Drops env.step
  # ~22-32s -> ~1-2s on big WA/VWA pages. See main.py _patch_lightweight_obs.
  skip_dom_extraction: true
