# Qwen3.5 computer-use (coord) rollout eval on WebVoyager.
# 643 multi-step web navigation tasks across 15 WebHarbor self-hosted mirrors.
#
# Observation: screenshot-only; env disables model-visible URL/title/DOM page context.
# Action: standard computer_use coordinate-based tools + back extra tool (no goto — see below).
#
# Related configs (sync env_kwargs when changing):
#   - scripts/configs/qwen3_5/default/webharbor.webvoyager/som.yaml            (SoM index-based mode)
#   - scripts/configs/qwen3_vl/default/webharbor.webvoyager/default.yaml

agent_id: "qwen3_5"
agent_kwargs:
  sampling_kwargs:  # only honored by rollout.py; RL sets sampling via the trainer (--rollout-temperature/--eval-temperature)
    temperature: 0.0

env_id: "webharbor.webvoyager"
env_kwargs:
  include_page_context_text: false
  # ``goto`` is intentionally NOT exposed: WebVoyager is a fully offline
  # WebHarbor mirror served only at 127.0.0.1:4000x, with no domain→mirror
  # resolver rules, so a URL ``goto`` escapes to the live internet and breaks
  # the reproducible eval. All 643 tasks are single-site and start on the
  # correct mirror, so in-page UI + ``back`` suffice. ``back`` is history-only
  # (no URL), so it stays on the mirror. WebVoyager's Selenium backend is
  # single-tab here; OpenWebRL-style tab tools are not wired.
  extra_tools: ["back", "response"]
