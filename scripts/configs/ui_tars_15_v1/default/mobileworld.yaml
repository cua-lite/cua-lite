# UI-TARS-1.5-7B rollout eval on MobileWorld
# 161 registered tasks; the eval runner filters 44 ask_user tasks, leaving
# 117 GUI-only tasks evaluated by real device / backend state.
#
# Related configs (sync env_kwargs / sampling when changing):
#   - scripts/configs/ui_tars/default/mobileworld.yaml  (UI-TARS-7B-DPO)
#   - scripts/configs/ui_tars_15_v1/default/androidworld.yaml  (mobile sibling)
#
# Decoding defaults align with UI-TARS/README_deploy.md (temperature=0.0,
# top_p=None, max_tokens=400). Kept identical to ui_tars/mobileworld.yaml for
# fair cross-checkpoint comparison unless reproducing a paper-specific table.
#
# Interaction tasks carry exclude_reason="ask_user". Direct rollout calls
# should pass --filter "lambda m: not m.others.get('exclude_reason')".

agent_id: "ui_tars_15_v1"
agent_kwargs:
  sampling_kwargs:  # only honored by rollout.py; RL sets sampling via the trainer (--rollout-temperature/--eval-temperature)
    temperature: 0.0
    # max_new_tokens=400 matches UI-TARS/README_deploy.md (default would
    # be 2048 from scripts/rollout.py; we cap to stay aligned with
    # the upstream deploy example + ui_tars sibling).
    max_new_tokens: 400

# max_steps omitted: mobileworld's env default is 50 (upstream ``mw eval
# --max_round 50``).
env_id: "mobileworld"
env_kwargs:
  loop_detect: 5
  extra_tools: ["response", "terminate"]
