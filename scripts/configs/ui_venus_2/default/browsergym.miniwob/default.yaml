# UI-Venus-2-9B vision+coord rollout eval on cua-lite browsergym.miniwob.
#
# This row uses UI-Venus-2's browser grammar. Sampling and image history match
# the WebHarbor WebVoyager browser row; MiniWoB uses the same screenshot+coord
# BrowserGym env contract as the Qwen default rows.
#
# Related configs:
#   - scripts/configs/ui_venus_2/default/webharbor.webvoyager/default.yaml
#   - scripts/configs/qwen3_vl/default/browsergym.miniwob/default.yaml

agent_id: "ui_venus_2"
agent_kwargs:
  sampling_kwargs:
    temperature: 0.0
    max_new_tokens: 4096
  protocol_kwargs:
    n_history_images: 2

env_id: "browsergym.miniwob"
env_kwargs:
  max_steps: 10
  extra_tools: ["response", "terminate", "goto", "back", "forward"]
  use_screenshot: true
  use_ax_tree: false
  include_page_context_text: false
  skip_dom_extraction: true
