# UI-Venus-2-9B rollout eval on ScreenSpot-Pro
# Single-step point grounding. One of UI-Venus-2's headline benches.
#
# Wire format: NO system message and no tag block — the whole instruction surface
# is one user message holding the screenshot then the prompt, and the answer is a
# bare ``[x,y]`` list normalized to 1000. Single-step, so there is no history and
# no image window.
#
# Sampling is greedy. ``max_new_tokens`` is left unset, i.e. the 2048 rollout
# default (``DEFAULT_SAMPLING_KWARGS`` in /lite/infer/serving.py), matching every
# sibling grounding row. The answer is one short list, but ``enable_thinking``
# leaves ``<think>`` open in the generation prompt, so the budget has to cover
# the reasoning in front of it: at the 256 this row used to pin, half the turns
# never emitted ``</think>`` and the parser read the answer out of unfinished
# reasoning.
#
# Related configs:
#   - scripts/configs/ui_venus_2/default/osworld_g.yaml  (sibling grounding bench)

agent_id: "ui_venus_2"
agent_kwargs:
  sampling_kwargs:  # only honored by rollout.py; RL sets sampling via the trainer (--rollout-temperature/--eval-temperature)
    temperature: 0.0

env_id: "screenspot_pro"
