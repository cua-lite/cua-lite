# Qwen3-VL RL training on WebGym
# Multi-step web information retrieval tasks via OmniBoxes HTTP API.
#
# Related configs (sync env_kwargs when changing):
#   - scripts/configs/qwen3_vl/default/webgym.yaml  (rollout eval)
#
# full_history_size=1 (reduced from the rollout default to save VRAM during training)

agent_id: "qwen3_vl"
agent_kwargs:
  resolution: [1280, 720]   # RL agent-side downsample (VRAM)
  # Standard Qwen3VLHistoryProtocol.
  protocol_kwargs:
    full_history_size: 1
  sampling_kwargs:  # only honored by rollout.py; RL sets sampling via the trainer (--rollout-temperature/--eval-temperature)
    temperature: 0.0

# max_steps is omitted so webgym uses per-difficulty budgets based on split:
#   train: easy(1-3)→15, medium(4-6)→25, hard(7+)→35
#   eval:  easy(1-3)→15, medium(4-6)→25, hard(7+)→35
# Pass max_steps to override.
env_id: "webgym"
env_kwargs:
  instruction_template: "{instruction}\n\nInitial website: {website}\n\nWhen you have found the answer, submit it with the response action. If you genuinely cannot find it, say so plainly rather than guessing."
  # WebGym extra_tools: webgym is a Playwright env whose screenshot has
  # NO browser chrome (no address bar / tabs), so cross-page tasks are only
  # solvable with nav tools. Opened so the student's surface matches the gpt
  # teacher recipe (gpt/recipes/collect/webgym.yaml) — the same surface the
  # SFT data is collected under (export_sft replays it from saved metadata).
  loop_detect: 5
  extra_tools: ["goto", "back", "response"]  # nav + final answer; no env default injection
