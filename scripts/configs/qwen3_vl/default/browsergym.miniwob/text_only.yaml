# Qwen3-VL text-only rollout on cua-lite browsergym.miniwob.
#
# Sister to webarena/text_only.yaml; same Group A/B knobs, max_steps=10
# per BrowserGym DEFAULT_BENCHMARKS. Paper baseline (Qwen3.5-9B base):
# 63.2% on MiniWoB.
#
# Prereqs: miniwob HTML server on 7560; MINIWOB_URL=http://localhost:7560/miniwob/.

agent_id: "qwen3_vl.base"
agent_kwargs:
  # Use the same `browsergym.generic` rebuild-per-turn protocol as the WA/VWA/AB
  # text_only.yaml siblings — single source of truth for browsergym text+bid.
  # MiniWoB AXTree is tiny (~1K) so `lite.history` would also work here, but
  # keeping all four bench configs consistent makes the harness simpler.
  protocol_key: "browsergym.generic"
  protocol_kwargs:
    use_concrete_example: false
    use_hints: true
  sampling_kwargs:  # only honored by rollout.py; RL sets sampling via the trainer (--rollout-temperature/--eval-temperature)
    temperature: 0.0
  # AgentLab paper-aligned minimal system prompt — see webarena sibling
  # for full rationale.
  system_prompt: |-
    You are an agent trying to solve a web task based on the content of the page and
    user instructions. You can interact with the page and explore, and send messages to the user. Each time you
    submit an action it will be sent to the browser and you will receive a new page.

env_id: "browsergym.miniwob"
env_kwargs:
  include_page_context_text: true
  max_steps: 10
  # Mark SVG children too; bid-only MiniWoB tasks like ascending-numbers need
  # individual <text> elements to receive bids.
  tags_to_mark: "all"
  # ─── Obs mode: text-only AXTree (no screenshot) ──────────────────────
  # ``use_screenshot=false`` + ``use_ax_tree=true`` = text-only obs (the
  # agent-as-annotators / paper observation shape). Per-step obs is the
  # AXTree dump — no images. See ``lite/gym/envs/browsergym/main.py``
  # ``BrowserGymConfig`` for the full ObsFlags surface.
  use_screenshot: false
  use_ax_tree: true
  use_focused_element: true
  use_error_logs: true
  extract_visible_tag: true
  extract_clickable_tag: true
  extract_coords: "False"
  filter_visible_elements_only: false
  # bid + chat + infeas: `bid` alone surfaces no finish action. `chat` →
  # `response`, `infeas` → `terminate`; ``extra_tools`` below makes those
  # BrowserGym tools active while ``valid_actions: []`` removes only coords.
  action_subsets: ["bid", "chat", "infeas"]
  extra_tools: ["scroll", "fill", "select_option", "click", "dblclick", "hover", "press", "focus", "clear", "drag_and_drop", "upload_file", "response", "terminate"]
  # Disable only the LiteBrowser coord action-batch tool. BrowserGym bid/finish tools
  # stay active through ``extra_tools`` above; rejected GUI calls still get
  # paired model-visible feedback with the current obs text/image preserved.
  valid_actions: []
