# Qwen3-VL rollout eval on MobileGym
# 416 parameterized mobile tasks across 28 simulated apps, evaluated by
# deterministic state-diff judges (Success Rate 1.0/0.0).
#
# MobileGym uses 1080x2400 physical pixels (DPR=3, CSS 360x800).
# Coordinates are [0, 1000] normalized — matches LiteMobileActionSpace.

agent_id: "qwen3_vl"
agent_kwargs:
  sampling_kwargs:  # only honored by rollout.py; RL sets sampling via the trainer (--rollout-temperature/--eval-temperature)
    temperature: 0.0

env_id: "mobilegym"
env_kwargs:
  # Qwen native open parses to canonical open_app; opt in to the env-side
  # extra_tool boundary so app launch is available in this task.
  loop_detect: 5
  extra_tools: ["open_app", "response", "terminate"]
