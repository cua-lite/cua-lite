# Qwen3.5 desktop.use — 1280x720 screenshot, NATIVE <think> reasoning.
#
# The config examples/lite/v1/README.md runs end to end: SFT export, RL rollout, and
# eval of the trained checkpoint.
#
# One config for the WHOLE desktop.use family (Lite.OSWorld / Lite.ScaleCUA /
# Lite.CUAGym / Lite.CUAWorld). They share the same qwen3_5 desktop.use adapter, so a
# single config drives the joint export.
#
# The four configs here are a 2x2 over screenshot size x reasoning mode; nothing else
# differs between them:
#
#   desktop.use.default.yaml            native res  Action-only
#   desktop.use.default.reasoning.yaml  native res  <think>
#   desktop.use.compact.yaml            1280x720    Action-only
#   desktop.use.compact.reasoning.yaml  1280x720    <think>       <- this file
#
# Reasoning uses Qwen3.5's NATIVE <think>...</think> channel (enable_thinking: true) —
# NOT a prompted "Thought:" system prompt. system_prompt is omitted, so the adapter
# falls back to its canonical USE_SYSTEM_PROMPT (Action-only, no Thought: line).
# The teacher stores its Thought as an inline_reasoning content part, so run
# examples/lite/v1/internalize_cot.py on the dataset FIRST to move it into the
# reasoning_content field — the chat template then renders it as <think>.
#
# NO env_id: export_sft never reads it (adapter is picked per-row from the data's
# metadata.dims + this agent_id → qwen3_5@desktop@use). For RL/rollout
# the env is selected separately (ENV_ID / --env-id), and env_kwargs below apply.

agent_id: "qwen3_5"
agent_kwargs:
  sampling_kwargs:  # only honored by rollout.py; export_sft drops it, RL sets sampling via the trainer
    temperature: 0.0
  enable_thinking: true     # native <think> channel (no prompted Thought:/Action: format)
  # agent-side downsample (VRAM); same value as scripts/configs/qwen3_5/compact/lite.osworld.yaml.
  # Qwen smart_resize then rounds to a multiple of 32, so the model sees 1280x704.
  resolution: [1280, 720]
  # protocol_kwargs omitted → Qwen3_5HistoryProtocol defaults
  #                           (history_n=50, image_max=4, fold_size=4).

env_kwargs:
  max_steps: 30
  loop_detect: 5
  # Qwen native `answer` lowers to `response`; imperative tasks still need `terminate`.
  # The sandbox accepts both unconditionally (LiteFinishToolSet), so this is about the
  # PROMPT: without it the rendered action enum omits them and the model is evaluated
  # on a surface its SFT data did not have. Sync with
  # scripts/configs/qwen3_5/default/lite.osworld.yaml.
  extra_tools: ["response", "terminate"]
