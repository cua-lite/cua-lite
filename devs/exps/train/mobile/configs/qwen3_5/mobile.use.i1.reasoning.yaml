# Qwen3.5 mobile.use — 720x1600 screenshot, image_max 1, native <think> reasoning.
#
# `i1` IS image_max. history_n stays at the protocol default (100), so TEXT history
# is uncapped: every past turn is still rendered in full — its literal `<tool_call>`
# (action name, coordinates, typed text) and, on the reasoning arm, its `<think>`.
# Only screenshots are capped.
#
# fold_size MUST equal image_max: fold_size > image_max blinds most steps (at
# image_max 1 / fold_size 4 the model sees an image only every 4th step). A
# one-image window is never prefix-compatible with the next step, so `i1` does not
# pack (1.00 steps/segment) and pays one image encoding per step.
#
#                              resolution  img  text hist   mode
#   mobile.use.i1.yaml           720x1600    1  all turns   Action
#   mobile.use.i1.reasoning.yaml 720x1600    1  all turns   <think>   <- this file
#   mobile.use.i4.yaml           720x1600  1-4  all turns   Action
#   mobile.use.i4.reasoning.yaml 720x1600  1-4  all turns   <think>
#
# One resolution across all four: unlike the desktop campaign there is no lowr/highr
# axis here, so the profile name carries only the knobs that actually vary.
#
#
# Reasoning teachers only. gpt5_5's published rows carry the Thought in
# reasoning_content (devs/data/internalize_cot.py runs before staging);
# qwen3_5_27b's carry the native <think> straight from collection. qwen3_8_27b
# rows have none, so this config would train an empty <think> block on them.
#
# No env_id: rollout picks the env via --env-id, export_sft picks the adapter per row
# from metadata.dims. system_prompt omitted -> the adapter's canonical USE_SYSTEM_PROMPT.

agent_id: "qwen3_5"
agent_kwargs:
  sampling_kwargs:  # rollout.py only; export_sft drops it, RL sets sampling in the trainer
    temperature: 0.0
  enable_thinking: true     # native <think> channel. The `Action:` line still comes from
                            # the pinned USE_SYSTEM_PROMPT, and inline `Thought:` is off in
                            # BOTH arms (adapter enable_inline_reasoning=False).
  # The frame the screenshot is resized to before it reaches the processor. It is NOT
  # the tensor shape: Qwen3.5's mobile adapter sets smart_resize_enabled=False
  # (adapter.py), but the HF processor still rounds to its own patch grid, so the model
  # sees 704x1600 (image_grid_thw [1,100,44]) — exactly as desktop's 1280x720 becomes
  # 1280x704.
  #
  # Coordinates are unaffected either way. Canonical Lite coordinates are NORMALIZED to
  # [0, 1000] (lite/core/tools/action_space/geometry.py), so no resize on either side
  # can shift them, and a teacher acting on the env-native 1080x2400 exports into this
  # profile with its numbers unchanged (measured: 56/56 coordinate pairs). The
  # "32-px rounding would shift coordinates" rationale in adapter.py is inherited from
  # Qwen2.5-VL, which IS pixel-in-resized-frame; it does not apply to this family.
  resolution: [720, 1600]
  protocol_kwargs:
    # Pinned, not inherited: the `i1` in the filename IS image_max, so a change to the
    # protocol default must not silently rename this profile. history_n omitted -> 100.
    image_max: 1
    fold_size: 1

env_kwargs:
  # max_steps omitted -> mobilegym's per-task difficulty budget (L1 15 / L2 30 /
  # L3 45 / L4 60). A number here would flatten it across all four tiers.
  loop_detect: 5
  # Required, not cosmetic: without these the env rejects them as inactive extras and
  # the model can never end an episode (or launch an app). Qwen native `open` parses
  # to canonical `open_app`, `answer` to `response`.
  extra_tools: ["open_app", "response", "terminate"]
