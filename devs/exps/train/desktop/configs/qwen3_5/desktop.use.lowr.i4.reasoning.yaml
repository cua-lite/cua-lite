# Qwen3.5 desktop.use — 1280x720 screenshot, image_max 4, native <think> reasoning.
#
# The reasoning arm of the lowr.i4 profile. Pairs with
# desktop.use.lowr.i4.yaml, which it differs from by enable_thinking alone.
#
# Reasoning teachers only. gpt5_5's published rows carry the Thought in
# reasoning_content (devs/data/internalize_cot.py runs before staging);
# qwen3_5_27b's carry the native <think> straight from collection. qwen3_8_27b
# rows have none, so this config would train an empty <think> block on them.
#
#                                        resolution        img  text hist  mode
#                                                               (turns kept)
#   desktop.use.default.yaml             native 1920x1080  1-4  all turns  Action
#   desktop.use.default.reasoning.yaml   native 1920x1080  1-4  all turns  <think>
#   desktop.use.lowr.i4.yaml             1280x720          1-4  all turns  Action
#   desktop.use.lowr.i4.reasoning.yaml   1280x720          1-4  all turns  <think>  <- this file
#   desktop.use.lowr.h1.yaml             1280x720            1  1 turn     Action
#   desktop.use.lowr.h1.reasoning.yaml   1280x720            1  1 turn     <think>
#   desktop.use.lowr.i1.yaml             1280x720            1  all turns  Action
#   desktop.use.lowr.i1.reasoning.yaml   1280x720            1  all turns  <think>
#   desktop.use.highr.h1.yaml            native 1920x1080    1  1 turn     Action
#   desktop.use.highr.h1.reasoning.yaml  native 1920x1080    1  1 turn     <think>
#   desktop.use.highr.i1.yaml            native 1920x1080    1  all turns  Action
#   desktop.use.highr.i1.reasoning.yaml  native 1920x1080    1  all turns  <think>
#
# No env_id: rollout picks the env via --env-id, export_sft picks the adapter per row
# from metadata.dims. system_prompt omitted -> the adapter's canonical USE_SYSTEM_PROMPT.

agent_id: "qwen3_5"
agent_kwargs:
  sampling_kwargs:  # rollout.py only; export_sft drops it, RL sets sampling in the trainer
    temperature: 0.0
  enable_thinking: true     # native <think> channel. The `Action:` line still comes from the
                            # pinned USE_SYSTEM_PROMPT, and inline `Thought:` is off in BOTH
                            # arms (adapter enable_inline_reasoning=False).
  resolution: [1280, 720]  # smart_resize rounds to x32 -> the model sees 1280x704
  protocol_kwargs:
    # Pinned, not inherited: the `i4` in the filename IS image_max, so a change to the
    # protocol default must not silently rename this profile. history_n omitted -> 100.
    # fold_size must track image_max: below it, adjacent steps stop being prefix-
    # compatible and build_segment_samples can no longer pack them: at fold_size 1 that is
    # 1.43 steps/segment and 2.8x the image encodings (1.6x at 2, 1.2x at 3).
    image_max: 4
    fold_size: 4

env_kwargs:
  max_steps: 30
  loop_detect: 5
  # Required, not cosmetic: without it the env rejects both as inactive extras and the
  # model can never end an episode. Qwen's native `answer` lowers to `response`.
  extra_tools: ["response", "terminate"]
