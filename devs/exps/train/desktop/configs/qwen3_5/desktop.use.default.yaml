# Qwen3.5 desktop.use — native screenshot, Action-only. The unmodified baseline.
#
# Not a campaign cell: this is the fourth corner (highr.i4), the full budget.
#
#                                        resolution        img  text hist  mode
#                                                               (turns kept)
#   desktop.use.default.yaml             native 1920x1080  1-4  all turns  Action   <- this file
#   desktop.use.default.reasoning.yaml   native 1920x1080  1-4  all turns  <think>
#   desktop.use.lowr.i4.yaml             1280x720          1-4  all turns  Action
#   desktop.use.lowr.i4.reasoning.yaml   1280x720          1-4  all turns  <think>
#   desktop.use.lowr.h1.yaml             1280x720            1  1 turn     Action
#   desktop.use.lowr.h1.reasoning.yaml   1280x720            1  1 turn     <think>
#   desktop.use.lowr.i1.yaml             1280x720            1  all turns  Action
#   desktop.use.lowr.i1.reasoning.yaml   1280x720            1  all turns  <think>
#   desktop.use.highr.h1.yaml            native 1920x1080    1  1 turn     Action
#   desktop.use.highr.h1.reasoning.yaml  native 1920x1080    1  1 turn     <think>
#   desktop.use.highr.i1.yaml            native 1920x1080    1  all turns  Action
#   desktop.use.highr.i1.reasoning.yaml  native 1920x1080    1  all turns  <think>
#
# No env_id: rollout picks the env via --env-id, export_sft picks the adapter per row
# from metadata.dims. system_prompt omitted -> the adapter's canonical USE_SYSTEM_PROMPT.

agent_id: "qwen3_5"
agent_kwargs:
  sampling_kwargs:  # rollout.py only; export_sft drops it, RL sets sampling in the trainer
    temperature: 0.0
  # resolution omitted -> native 1920x1080; smart_resize rounds to 1920x1088.
  # protocol_kwargs omitted -> protocol defaults (history_n=100, image_max=4, fold_size=4).

env_kwargs:
  max_steps: 30
  loop_detect: 5
  # Required, not cosmetic: without it the env rejects both as inactive extras and the
  # model can never end an episode. Qwen's native `answer` lowers to `response`.
  extra_tools: ["response", "terminate"]
